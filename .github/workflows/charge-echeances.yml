name: Charge échéances Stripe
on:
  schedule:
    - cron: '0 6 * * *'  # Tous les jours à 6h UTC
  workflow_dispatch:  # Permet de lancer manuellement

jobs:
  charge:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le prélèvement des échéances
        run: |
          curl -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NEXT_PUBLIC_SITE_URL }}/api/cron/charge-echeances"
